name: M045 Native + Browser Full Regression
on:
  push:
    branches:
      - feat/m045-native-generation-attempt
      - feat/platform-identity-and-catalog
  pull_request:
    branches:
      - main
      - feat/m045-native-generation-attempt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install browser-test Playwright without modifying lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium browser and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify Chromium binary and Playwright import
        shell: bash
        run: |
          set -euo pipefail
          echo "CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          node -e "const {chromium}=require('playwright'); console.log('Playwright Chromium:',chromium.executablePath())"
      - name: Complete Python repository tests with zero skips
        env:
          PYTHON_MIN_TESTS: '635'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools:tests python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/m045-python.log
          count=$(awk '/^Ran [0-9]+ tests in / {n=$2} END {print n}' /tmp/m045-python.log)
          test -n "$count"
          test "$count" -ge "$PYTHON_MIN_TESTS"
          ! grep -Eq '(^FAILED|skipped=[1-9][0-9]*)' /tmp/m045-python.log
      - name: All Node tests with zero skips
        env:
          NODE_MIN_TESTS: '51'
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/*.cjs 2>&1 | tee /tmp/m045-node.log
          count=$(awk '/^# tests / {n=$3} END {print n}' /tmp/m045-node.log)
          passed=$(awk '/^# pass / {n=$3} END {print n}' /tmp/m045-node.log)
          test -n "$count"
          test "$count" -ge "$NODE_MIN_TESTS"
          test "$passed" -eq "$count"
          grep -Eq '^# fail 0$' /tmp/m045-node.log
          grep -Eq '^# skipped 0$' /tmp/m045-node.log
          grep -Eq '^# cancelled 0$' /tmp/m045-node.log
      - name: Dedicated Playwright Chromium suite with zero skips
        env:
          BROWSER_MIN_TESTS: '34'
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/*.browser.cjs 2>&1 | tee /tmp/m045-browser.log
          count=$(awk '/^# tests / {n=$3} END {print n}' /tmp/m045-browser.log)
          passed=$(awk '/^# pass / {n=$3} END {print n}' /tmp/m045-browser.log)
          test -n "$count"
          test "$count" -ge "$BROWSER_MIN_TESTS"
          test "$passed" -eq "$count"
          grep -Eq '^# fail 0$' /tmp/m045-browser.log
          grep -Eq '^# skipped 0$' /tmp/m045-browser.log
          grep -Eq '^# cancelled 0$' /tmp/m045-browser.log
      - name: Retain exact regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m045-browser-and-python-regression
          path: |
            /tmp/m045-node.log
            /tmp/m045-python.log
            /tmp/m045-browser.log
          if-no-files-found: warn
